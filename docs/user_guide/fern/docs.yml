# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

# Generate only the emulator's public C++ API. Scope is restricted to the
# top-level headers of `src/hololink/emulation` (the emulator HAL interface) by
# `emulation.Doxyfile` (INPUT + RECURSIVE = NO), so implementation / build /
# example / binding subdirectories are not parsed. The build helper post-
# processes the generated MDX before Fern validates, previews, or publishes it.
#
# Library key `hololink-emulation` is deliberately NOT `hololink`: this entry
# documents the `hololink::emulation` sub-namespace as a standalone API-reference
# section, not the whole `hololink` library. Future top-level `hololink` C++ API
# docs will be a separate `libraries:` entry (with its own subpath, once the
# public headers move out of `src/hololink/emulation`). One consequence: Fern's
# C++ generator only emits Stage-4 namespace index pages when the library key
# matches a top-level C++ namespace name -- since ours does not, we get just
# the per-compound pages (classes / functions / enums / typedefs / variables)
# and the `Emulation API` folder in `index.yml` takes the place of a landing
# page for the section.
libraries:
  hololink-emulation:
    input:
      path: ../../../src/hololink/emulation
    output:
      path: ./generated/api-reference/cpp/emulation
    lang: cpp
    config:
      doxyfile: ./emulation.Doxyfile

  # The versioned service interfaces an application resolves through the
  # service locator (`HololinkInterfaceV1`, `I2cInterfaceV1`, ...). Scope is
  # restricted to the public include tree by `module.Doxyfile`, so the module
  # implementations and the host runtime are not parsed.
  #
  # Same key-naming rule as above: `hololink-module` deliberately does not
  # equal the top-level C++ namespace (`hololink`), so Fern emits only the
  # per-compound pages and writes them nested under
  # `hololink/namespaces/module/{classes,functions,...}` beneath `output.path`.
  # `index.yml` points its `folder:` entry at that deep subtree.
  hololink-module:
    input:
      path: ../../../hololink_module/host/include/hololink/module
    output:
      path: ./generated/api-reference/cpp/module
    lang: cpp
    config:
      doxyfile: ./module.Doxyfile

instances:
  - url: nvidia-holoscan.docs.buildwithfern.com/holoscan/sensor-bridge
    custom-domain: docs.nvidia.com/holoscan/sensor-bridge
    multi-source: true

global-theme: nvidia

ai-search:
  location:
    - docs

title: Holoscan Sensor Bridge Documentation

products:
  - display-name: Holoscan Sensor Bridge
    slug: /
    path: index.yml
    versions:
      - display-name: 2.7 (Latest)
        path: ./index.yml
        availability: ga
      - display-name: Archives
        path: ./versions/archives.yml

layout:
  searchbar-placement: header
  page-width: 1376px
  sidebar-width: 248px
  content-width: 812px
  tabs-placement: header
  hide-feedback: true

colors:
  accentPrimary:
    dark: '#76B900'
    light: '#76B900'
  background:
    light: '#FFFFFF'
    dark: '#000000'
typography:
  bodyFont:
    name: NVIDIA
    paths:
      - path: assets/fonts/NVIDIASans.woff2
        style: normal
      - path: assets/fonts/NVIDIASans_Italic.woff2
        style: italic
  codeFont:
    name: RobotoMono
    paths:
      - path: assets/fonts/RobotoMono.woff2
theme:
  page-actions: toolbar
  footer-nav: minimal

logo:
  dark: assets/NVIDIA_dark.svg
  light: assets/NVIDIA_light.svg
  height: 20
  href: /holoscan/sensor-bridge
  right-text: Documentation

favicon: assets/NVIDIA_symbol.svg

# Send unmatched paths to the docs homepage instead of Fern's 404 page.
# Prefer explicit `redirects` below for known Sphinx → Fern page moves.
settings:
  hide-404-page: true

js:
  - url: https://assets.adobedtm.com/5d4962a43b79/c1061d2c5e7b/launch-191c2462b890.min.js
    strategy: beforeInteractive
  - path: dist/output.js
    strategy: afterInteractive
css:
  - assets/main.css
  - dist/output.css

redirects:
  # Paths are relative to the site root; subpath prefix matches instances + custom-domain.
  # Legacy Sphinx used .../latest/<page>.html; Fern uses section/page slugs.
  - source: "/holoscan/sensor-bridge/latest/index.html"
    destination: "/holoscan/sensor-bridge"
  - source: "/holoscan/sensor-bridge/latest"
    destination: "/holoscan/sensor-bridge"
  - source: "/holoscan/sensor-bridge/index.html"
    destination: "/holoscan/sensor-bridge/getting-started/introduction"
  - source: "/holoscan/sensor-bridge/latest/introduction.html"
    destination: "/holoscan/sensor-bridge/getting-started/introduction"
  - source: "/holoscan/sensor-bridge/introduction.html"
    destination: "/holoscan/sensor-bridge/getting-started/introduction"
  - source: "/holoscan/sensor-bridge/introduction"
    destination: "/holoscan/sensor-bridge/getting-started/introduction"
  - source: "/holoscan/sensor-bridge/introduction/introduction"
    destination: "/holoscan/sensor-bridge/getting-started/introduction"
